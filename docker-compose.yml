# Infraestructura compartida SI-16 (research R12): PostgreSQL 16 + Redis 7.
# Credenciales configurables desde .env (ver .env.example); los valores por
# defecto coinciden con los que ya usa el equipo.
services:
  postgres:
    image: postgres:16-alpine
    container_name: si16_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-si16_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-si16_password}
      POSTGRES_DB: ${POSTGRES_DB:-si16_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: si16_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
